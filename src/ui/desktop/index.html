<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argentum</title>
    <link rel="icon" type="image/png" href="./assets/argentum.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .skip-to-content {
        position: absolute;
        left: -999px;
        top: 0;
        z-index: 9999;
        padding: 0.5rem 1rem;
        background: var(--color-bg, #0f0f0f);
        color: var(--color-accent, #e23b3b);
        font-weight: 600;
        text-decoration: none;
        border-radius: 0 0 4px 0;
      }
      .skip-to-content:focus {
        left: 0;
        outline: 2px solid var(--color-accent, #e23b3b);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <a class="skip-to-content" href="#view-root">Skip to main content</a>
    <main class="shell">
      <aside class="rail" aria-label="Argentum navigation">
        <div class="brand-wordmark">
          <strong>Argentum</strong>
          <span>v0.0.8-alpha</span>
        </div>
        <nav id="section-nav" class="section-nav"></nav>
        <button class="workspace-card" id="workspace-button" type="button" aria-haspopup="menu">
          <span>Workspace</span>
          <strong id="workspace-path"></strong>
        </button>
        <img class="brand-shard" src="./assets/argentum.png" alt="" />
      </aside>

      <section class="content">
        <header class="topbar">
          <div class="topbar-left">
            <nav class="breadcrumb-bar" aria-label="Workspace breadcrumb">
              <span>Workspaces</span>
              <span>Argentum</span>
              <strong>workspace</strong>
            </nav>
            <div>
              <p id="eyebrow" class="eyebrow">Onboarding</p>
              <h1 id="section-title">Welcome</h1>
            </div>
          </div>
          <div class="view-mode-switcher" role="group" aria-label="View mode">
            <button class="active" type="button" data-view-mode="chat">CHAT</button>
          </div>
          <div class="topbar-actions">
            <div id="provider-status-pill"></div>
            <button
              class="icon-button"
              id="help-button"
              title="Help for this screen"
              aria-label="Help for this screen"
            >
              <span data-icon="help"></span>
            </button>
            <button
              class="icon-button"
              id="notifications-button"
              title="Notifications"
              aria-label="Notifications"
            >
              <span data-icon="bell"></span>
            </button>
            <button
              class="icon-button"
              id="audit-button"
              title="Open audit trail"
              aria-label="Open audit trail"
            >
              <span data-icon="shield"></span>
            </button>
            <button
              class="icon-button"
              id="settings-button"
              title="Open settings"
              aria-label="Open settings"
            >
              <span data-icon="settings"></span>
            </button>
          </div>
        </header>

        <div id="view-root" class="view-root"></div>
      </section>
    </main>
    <div id="overlay-root"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
