<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Argentum System Dashboard</title>
<style>
:root{
  --bg:#050508;
  --deck:#0b0d13;
  --deck2:#10131b;
  --ink:#eef0f7;
  --muted:#a8adbf;
  --dim:#6e7488;
  --line:#2d3242;
  --line2:#444b60;
  --soft:rgba(214,218,228,.085);
  --softer:rgba(214,218,228,.045);
  --silver:#d6dae4;
  --cyan:#78d6df;
  --blue:#6fa4d8;
  --green:#3f9f69;
  --yellow:#d7bd55;
  --orange:#d8873e;
  --red:#d94f55;
  --shadow:0 18px 44px rgba(0,0,0,.30);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  color:var(--ink);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:12px;
  letter-spacing:.01em;
  background:
    linear-gradient(135deg,rgba(255,255,255,.028) 0 1px,transparent 1px 22px),
    linear-gradient(180deg,#080911 0%,#050508 58%,#030306 100%);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background-image:
    linear-gradient(rgba(214,218,228,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(214,218,228,.04) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.88),transparent 78%);
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.09;
  background:repeating-linear-gradient(135deg,transparent 0 20px,rgba(214,218,228,.035) 20px 21px);
}

/* ─── Header ────────────────────────────────────────────── */
.header{
  position:sticky;
  top:0;
  z-index:10;
  min-height:64px;
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 18px;
  background:rgba(5,5,8,.88);
  border-bottom:1px solid rgba(214,218,228,.14);
  backdrop-filter:blur(14px);
}
.header::before{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  bottom:-1px;
  height:1px;
  background:linear-gradient(90deg,var(--red) 0 8%,transparent 8% 12%,var(--line2) 12% 84%,transparent 84% 89%,var(--cyan) 89% 100%);
  opacity:.70;
}
.header::after{
  content:"";
  position:absolute;
  left:18px;
  bottom:-1px;
  width:88px;
  height:1px;
  background:rgba(238,240,247,.56);
  animation:sweep 6.5s linear infinite;
}
@keyframes sweep{
  0%{transform:translateX(0);opacity:0}
  10%{opacity:.72}
  90%{opacity:.72}
  100%{transform:translateX(calc(100vw - 140px));opacity:0}
}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand-title{
  font-size:18px;
  font-weight:950;
  letter-spacing:1px;
  line-height:1;
  color:var(--silver);
  white-space:nowrap;
}
.brand-title span{color:var(--cyan)}
.brand-sub{
  font-size:10px;
  color:var(--dim);
  letter-spacing:.45px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:360px;
}
.divider{width:1px;height:32px;background:linear-gradient(180deg,transparent,var(--line2),transparent)}
.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border:1px solid rgba(217,79,85,.30);
  background:rgba(217,79,85,.07);
  padding:5px 10px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.live-dot{
  width:6px;
  height:6px;
  background:var(--red);
  outline:3px solid rgba(217,79,85,.13);
  border-radius:50%;
  animation:blink 1.7s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.live span{
  font-size:10px;
  font-weight:850;
  letter-spacing:1.4px;
  color:var(--red);
}
.node{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
  max-width:280px;
  border-left:1px solid rgba(120,214,223,.32);
  padding:4px 0 4px 10px;
}
.node::before{
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--cyan);
  outline:3px solid rgba(120,214,223,.11);
  flex-shrink:0;
}
.node-name{
  font-size:11px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.time{
  margin-left:auto;
  color:var(--muted);
  font-size:11px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.8px;
  white-space:nowrap;
}

/* ─── Layout ──────────────────────────────────────────────── */
.dashboard{
  position:relative;
  z-index:1;
  width:100%;
  max-width:1900px;
  margin:0 auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* ─── Surface (card) ─────────────────────────────────────── */
.surface{
  position:relative;
  background:
    linear-gradient(145deg,rgba(255,255,255,.030),rgba(255,255,255,.008)),
    linear-gradient(180deg,var(--deck2),var(--deck));
  border:1px solid rgba(214,218,228,.13);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.035);
  overflow:hidden;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.surface::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(214,218,228,.050),rgba(214,218,228,.050)) top left/100% 1px no-repeat,
    repeating-linear-gradient(90deg,transparent 0 43px,rgba(214,218,228,.022) 43px 44px);
  opacity:.58;
}
.surface::after{
  content:"";
  position:absolute;
  left:14px;
  right:14px;
  bottom:0;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent,var(--line2)),transparent);
  opacity:.42;
}
.surface-overview{
  --accent:var(--cyan);
  display:grid;
  grid-template-columns:2.1fr 1.45fr .95fr;
}
.surface-live{
  --accent:var(--green);
  display:grid;
  grid-template-columns:1.45fr 1fr;
}
.surface-details{
  --accent:var(--silver);
  display:grid;
  grid-template-columns:1.45fr 1fr 1.1fr;
}

/* ─── Zones ───────────────────────────────────────────────── */
.zone{
  position:relative;
  min-width:0;
  padding:15px;
  z-index:1;
}
.zone + .zone{
  border-left:1px solid rgba(214,218,228,.085);
}
.zone-stack{
  display:flex;
  flex-direction:column;
}
.zone-stack .zone{
  padding:15px;
}
.zone-stack .zone + .zone{
  border-left:none;
  border-top:1px solid rgba(214,218,228,.085);
}
.zone-pair{
  display:grid;
  grid-template-columns:1fr 1fr;
}
.zone-pair .zone{
  padding:15px;
}
.zone-pair .zone + .zone{
  border-left:1px solid rgba(214,218,228,.085);
  border-top:none;
}
.zone-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px solid rgba(214,218,228,.075);
}
.zone-title{
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:900;
  color:var(--dim);
}
.zone-meta{
  font-size:9px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:54%;
  text-align:right;
}

/* ─── Status ──────────────────────────────────────────────── */
.status-main{
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
  gap:14px;
}
.big-state{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.state-label{
  font-size:9px;
  color:var(--dim);
  text-transform:uppercase;
  letter-spacing:1.4px;
  font-weight:850;
}
.state-value{
  font-size:38px;
  font-weight:950;
  letter-spacing:-1.7px;
  line-height:1;
  margin-top:4px;
  color:var(--silver);
}
.state-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
  line-height:1.35;
  max-width:520px;
}
.state-bar-wrap{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.state-bar{
  height:10px;
  background:rgba(214,218,228,.06);
  overflow:hidden;
  position:relative;
}
.state-bar::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,
    rgba(63,159,105,.10) 0%,
    rgba(63,159,105,.14) 34%,
    rgba(215,189,85,.14) 55%,
    rgba(216,135,62,.14) 78%,
    rgba(217,79,85,.16) 100%);
}
.state-bar-fill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0%;
  background:var(--fill,var(--green));
  transition:width .5s ease, background .5s ease;
}
.state-bar-labels{
  display:flex;
  justify-content:space-between;
  color:var(--dim);
  font-size:7px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:850;
}
.status-strip{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0;
  border-top:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
}
.status-cell{
  padding:9px 10px;
  min-width:0;
}
.status-cell + .status-cell{
  border-left:1px solid rgba(214,218,228,.08);
}
.status-cell label{
  display:block;
  color:var(--dim);
  font-size:7px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:850;
  margin-bottom:5px;
}
.status-cell strong{
  font-size:16px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
}
.side-readouts{
  display:flex;
  flex-direction:column;
  border-top:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
}
.readout{
  padding:11px 0;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
}
.readout + .readout{
  border-top:1px solid rgba(214,218,228,.075);
}
.readout label{
  color:var(--dim);
  font-size:7px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:850;
  white-space:nowrap;
}
.readout strong{
  font-size:22px;
  line-height:1;
  font-weight:950;
  font-variant-numeric:tabular-nums;
  text-align:right;
}

/* ─── Heat ───────────────────────────────────────────────── */
.heat-list{
  display:flex;
  flex-direction:column;
  border-top:1px solid rgba(214,218,228,.08);
}
.heat-row{
  padding:9px 0;
  display:grid;
  grid-template-columns:68px minmax(0,1fr) 56px;
  align-items:center;
  gap:10px;
  border-bottom:1px solid rgba(214,218,228,.075);
}
.heat-name{
  color:var(--dim);
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:.9px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.heat-meter{
  height:8px;
  background:rgba(214,218,228,.06);
  overflow:hidden;
  position:relative;
}
.heat-meter::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,
    rgba(63,159,105,.18) 0%,
    rgba(215,189,85,.18) 55%,
    rgba(216,135,62,.18) 78%,
    rgba(217,79,85,.20) 100%);
}
.heat-fill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0%;
  background:var(--fill,var(--green));
  transition:width .55s ease, background .55s ease;
}
.heat-fill.hot{animation:heatBreath 1.7s ease-in-out infinite}
@keyframes heatBreath{0%,100%{opacity:.82}50%{opacity:1}}
.heat-temp{
  text-align:right;
  font-size:13px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
}

/* ─── Alerts ─────────────────────────────────────────────── */
.alert-list{
  display:flex;
  flex-direction:column;
  border-top:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
}
.alert-item{
  padding:10px 0 10px 10px;
  border-left:3px solid var(--accent);
}
.alert-item + .alert-item{
  border-top:1px solid rgba(214,218,228,.075);
}
.alert-item strong{
  display:block;
  font-size:10px;
  font-weight:900;
  color:var(--ink);
  margin-bottom:3px;
}
.alert-item span{
  font-size:9px;
  color:var(--dim);
}
.ok-line{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--green);
  font-weight:850;
  font-size:10px;
  padding:8px 0;
}
.ok-line::before{
  content:"";
  width:7px;
  height:7px;
  background:var(--green);
  outline:4px solid rgba(63,159,105,.12);
  border-radius:50%;
}

/* ─── Load / CPU ─────────────────────────────────────────── */
.meter{
  display:flex;
  gap:3px;
  width:100%;
  height:18px;
  align-items:stretch;
}
.seg{
  flex:1;
  background:rgba(214,218,228,.070);
  border:1px solid rgba(214,218,228,.060);
  transition:background .45s ease,border-color .45s ease,transform .35s ease;
}
.seg.on{
  background:var(--seg-color);
  border-color:rgba(255,255,255,.12);
}
.surface:hover .seg.on{transform:translateY(-1px)}
.meter.big{
  height:34px;
  gap:4px;
  margin-top:2px;
}
.meter.big .seg{
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
}
.load-grid{
  display:grid;
  grid-template-columns:182px minmax(0,1fr);
  gap:15px;
  align-items:start;
}
.load-number{
  display:flex;
  flex-direction:column;
  gap:9px;
}
.load-number strong{
  font-size:54px;
  line-height:.92;
  font-weight:950;
  letter-spacing:-2px;
  font-variant-numeric:tabular-nums;
}
.load-number span{
  color:var(--dim);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  font-weight:850;
}
.chart-wrap{
  position:relative;
  height:122px;
  background:rgba(5,6,10,.34);
  border-top:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
  overflow:hidden;
}
.chart-wrap::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(90deg,transparent 0 39px,rgba(214,218,228,.038) 39px 40px),
    repeating-linear-gradient(0deg,transparent 0 29px,rgba(214,218,228,.030) 29px 30px);
  pointer-events:none;
}
.chart{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  display:block;
}
.core-lanes{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:0;
  margin-top:11px;
  border-top:1px solid rgba(214,218,228,.08);
  border-left:1px solid rgba(214,218,228,.08);
}
.core-lane{
  min-height:48px;
  padding:8px 6px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  gap:5px;
  border-right:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
}
.core-lane label{
  font-size:7px;
  color:var(--dim);
  text-transform:uppercase;
  font-weight:850;
  letter-spacing:.8px;
}
.core-lane strong{
  font-size:13px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.core-fill{
  height:4px;
  background:rgba(214,218,228,.07);
  overflow:hidden;
}
.core-fill span{
  display:block;
  height:100%;
  width:0;
  background:var(--fill);
  transition:width .45s ease,background .45s ease;
}

/* ─── Memory ──────────────────────────────────────────────── */
.mem-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 160px;
  gap:15px;
  align-items:start;
}
.slab{
  height:64px;
  background:rgba(5,6,10,.36);
  border-top:1px solid rgba(214,218,228,.09);
  border-bottom:1px solid rgba(214,218,228,.09);
  display:flex;
  overflow:hidden;
}
.slab-part{
  height:100%;
  transition:width .5s ease;
  background:var(--part);
  position:relative;
  min-width:0;
}
.slab-part::after{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.17) 0 1px,transparent 1px 9px);
  opacity:.12;
}
.mem-legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:9px;
  color:var(--muted);
  font-size:8px;
}
.mem-legend-item{
  display:flex;
  align-items:center;
  gap:5px;
}
.mem-legend-dot{
  width:9px;
  height:9px;
  background:var(--dot);
  border:1px solid rgba(255,255,255,.10);
}
.mem-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0;
  margin-top:10px;
  border-top:1px solid rgba(214,218,228,.08);
  border-left:1px solid rgba(214,218,228,.08);
}
.mini{
  padding:9px;
  min-width:0;
  border-right:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
}
.mini label{
  display:block;
  font-size:7px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--dim);
  font-weight:850;
  margin-bottom:5px;
}
.mini strong{
  font-size:13px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
}
.load-small{
  display:flex;
  flex-direction:column;
  border-top:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
}
.load-small .readout strong{font-size:19px}

/* ─── Tabs / tables ──────────────────────────────────────── */
.tabs{
  display:flex;
  gap:5px;
  margin-bottom:8px;
}
.tab{
  border:1px solid rgba(214,218,228,.10);
  background:transparent;
  color:var(--dim);
  font-size:8px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
  padding:5px 10px;
  cursor:pointer;
}
.tab.active{
  color:var(--cyan);
  border-color:rgba(120,214,223,.30);
  background:rgba(120,214,223,.055);
}
.table-wrap{
  max-height:178px;
  overflow:auto;
  border-top:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
}
.table-wrap::-webkit-scrollbar{width:5px;height:5px}
.table-wrap::-webkit-scrollbar-track{background:rgba(214,218,228,.05)}
.table-wrap::-webkit-scrollbar-thumb{background:rgba(120,214,223,.24)}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
th{
  font-size:7px;
  color:var(--dim);
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  text-align:left;
  padding:4px 6px 7px;
  border-bottom:1px solid rgba(214,218,228,.10);
}
td{
  font-size:10px;
  padding:5px 6px;
  border-bottom:1px solid rgba(214,218,228,.055);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
tr:hover td{background:rgba(255,255,255,.020)}
th:first-child,td:first-child{width:52%}

/* ─── Network / Disk / GPU / Power ─────────────────────── */
.net-list,.disk-list,.gpu-list{
  display:flex;
  flex-direction:column;
  border-top:1px solid rgba(214,218,228,.08);
}
.net-row,.disk-row,.gpu-row,.power-row{
  padding:9px 0;
  border-bottom:1px solid rgba(214,218,228,.075);
  min-width:0;
}
.net-top,.disk-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
}
.net-name,.disk-name,.gpu-name{
  font-size:10px;
  font-weight:900;
  color:var(--ink);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.net-ip,.disk-sub,.gpu-sub,.sys-sub{
  font-size:8px;
  color:var(--dim);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.signal{
  height:8px;
  background:rgba(214,218,228,.060);
  overflow:hidden;
  position:relative;
  margin-top:5px;
}
.signal span{
  display:block;
  height:100%;
  width:0;
  background:var(--fill);
  transition:width .45s ease;
  background-size:12px 12px;
}
.signal.active span{
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.24) 0 1px,transparent 1px 7px);
  animation:signalMove .9s linear infinite;
}
@keyframes signalMove{to{background-position:12px 0}}
.disk-fill{
  height:6px;
  background:rgba(214,218,228,.060);
  overflow:hidden;
}
.disk-fill span{
  display:block;
  height:100%;
  width:0;
  background:var(--fill);
  transition:width .45s ease;
}

/* ─── System grid ────────────────────────────────────────── */
.sys-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:0;
  border-top:1px solid rgba(214,218,228,.08);
  border-left:1px solid rgba(214,218,228,.08);
}
.sys-row{
  padding:9px;
  border-right:1px solid rgba(214,218,228,.08);
  border-bottom:1px solid rgba(214,218,228,.08);
  min-width:0;
}
.sys-row label,.power-row label{
  display:block;
  color:var(--dim);
  font-size:7px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:850;
  margin-bottom:4px;
}
.sys-row strong,.power-row strong{
  font-size:11px;
  font-weight:850;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
}

/* ═══════════════════════════════════════════════════════════
   Responsive — TABLET 1280px
   ═══════════════════════════════════════════════════════════ */
@media(max-width:1280px){
  .surface-overview,
  .surface-live,
  .surface-details{grid-template-columns:1fr}
  .zone + .zone{border-left:none;border-top:1px solid rgba(214,218,228,.085)}
  .zone-pair{grid-template-columns:1fr}
  .zone-pair .zone + .zone{border-left:none;border-top:1px solid rgba(214,218,228,.085)}
  .status-main,.load-grid,.mem-layout{grid-template-columns:1fr}
  .core-lanes{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sys-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ═══════════════════════════════════════════════════════════
   Responsive — MOBILE 720px and below
   Optimized for vertical phone screens 360px+
   ═══════════════════════════════════════════════════════════ */
@media(max-width:720px){
  /* Header: compact */
  .header{
    min-height:52px;
    padding:8px 12px;
    gap:8px;
  }
  .brand-title{font-size:15px}
  .brand-sub,.node,.divider,.live span{display:none}
  .live{
    padding:4px 8px;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  }
  .live-dot{width:5px;height:5px}
  .time{display:none}

  /* Dashboard: reduce padding/gap */
  .dashboard{
    padding:8px;
    gap:8px;
  }

  /* Surface: remove clip-path, add border-radius */
  .surface{
    clip-path:none;
    border-radius:10px;
  }
  .surface::before{opacity:.4}

  /* Overview: stack vertically */
  .surface-overview{
    grid-template-columns:1fr;
  }
  .surface-overview > .zone + .zone{
    border-left:none;
    border-top:1px solid rgba(214,218,228,.085);
  }

  /* Status area: stack big-state + side-readouts */
  .status-main{
    grid-template-columns:1fr;
    gap:10px;
  }
  .state-value{font-size:32px}
  .state-sub{max-width:100%}
  .status-strip{
    grid-template-columns:1fr;
  }
  .status-cell + .status-cell{
    border-left:none;
    border-top:1px solid rgba(214,218,228,.08);
  }

  /* Heat list */
  .heat-row{
    grid-template-columns:60px minmax(0,1fr) 48px;
    gap:8px;
  }

  /* Live section: stack CPU + Memory */
  .surface-live{
    grid-template-columns:1fr;
  }
  .surface-live > .zone + .zone{
    border-left:none;
    border-top:1px solid rgba(214,218,228,.085);
  }

  /* Load grid */
  .load-grid{
    grid-template-columns:1fr;
  }
  .load-number{
    flex-direction:row;
    align-items:center;
    gap:12px;
  }
  .load-number strong{
    font-size:42px;
    letter-spacing:-1px;
  }
  .meter.big{height:28px}

  /* Core lanes: 4 cols → 2 cols */
  .core-lanes{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  /* Memory layout */
  .mem-layout{
    grid-template-columns:1fr;
  }
  .load-small{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    border-top:1px solid rgba(214,218,228,.08);
  }
  .load-small .readout{
    border-top:none;
    border-right:1px solid rgba(214,218,228,.075);
    padding:10px 8px;
  }
  .load-small .readout:last-child{border-right:none}

  /* Details: stack all 3 columns */
  .surface-details{
    grid-template-columns:1fr;
  }
  .surface-details > .zone + .zone{
    border-left:none;
    border-top:1px solid rgba(214,218,228,.085);
  }

  /* Process table: full width, horizontal scroll */
  .table-wrap{max-height:none}
  .table-wrap::-webkit-scrollbar{height:4px}
  table{table-layout:auto}
  th:first-child,td:first-child{width:auto;min-width:90px}

  /* Zone pair: stack */
  .zone-pair{
    grid-template-columns:1fr;
  }
  .zone-pair .zone + .zone{
    border-left:none;
    border-top:1px solid rgba(214,218,228,.085);
  }

  /* Zone stack */
  .zone-stack .zone{
    padding:12px;
  }

  /* System grid: 3 cols → 2 cols */
  .sys-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  /* Network rows: compact */
  .net-row{padding:8px 0}
  .net-top{flex-wrap:wrap}
  .net-ip{font-size:9px}

  /* Disk rows */
  .disk-row{padding:8px 0}

  /* GPU/Power */
  .gpu-row,.power-row{padding:8px 0}

  /* Tabs: slightly larger touch targets */
  .tab{
    font-size:9px;
    padding:6px 12px;
  }

  /* Ok-line text */
  .ok-line{font-size:9px}
}

/* ═══════════════════════════════════════════════════════════
   Responsive — SMALL PHONE 380px and below
   ═══════════════════════════════════════════════════════════ */
@media(max-width:380px){
  /* Even more compact */
  .brand-title{font-size:13px}
  .dashboard{padding:6px;gap:6px}
  .zone{padding:10px}
  .zone-head{margin-bottom:8px;padding-bottom:6px}
  .zone-title{font-size:7px;letter-spacing:1.5px}

  /* Heat row: tighter */
  .heat-row{
    grid-template-columns:50px minmax(0,1fr) 42px;
    padding:7px 0;
  }
  .heat-name{font-size:7px}
  .heat-temp{font-size:11px}

  /* Status strip: 3 cols */
  .status-cell strong{font-size:14px}
  .status-cell{padding:7px 8px}

  /* Side readouts */
  .readout strong{font-size:17px}

  /* Mem list: 2 cols → 1 col */
  .mem-list{
    grid-template-columns:1fr;
  }
  .mini{
    padding:7px;
  }

  /* System grid: 3 cols → 1 col */
  .sys-grid{
    grid-template-columns:1fr;
  }

  /* Process table */
  td{font-size:9px;padding:4px 5px}
  th{font-size:6px;padding:3px 5px 5px}
}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="brand-title">Argentum <span>System Dashboard</span></div>
    <div class="brand-sub">Local system monitor</div>
  </div>
  <div class="divider"></div>
  <div class="live"><div class="live-dot"></div><span>LIVE</span></div>
  <div class="node"><div class="node-name" id="hostname">-</div></div>
  <div class="time" id="ts">-</div>
</header>

<main class="dashboard">
  <!-- Overview -->
  <section class="surface surface-overview">
    <div class="zone">
      <div class="zone-head">
        <div class="zone-title">Status</div>
        <div class="zone-meta" id="status-tag">-</div>
      </div>

      <div class="status-main">
        <div class="big-state">
          <div>
            <div class="state-label">Current state</div>
            <div class="state-value" id="state-value">Waiting</div>
            <div class="state-sub" id="state-sub">No data yet.</div>
          </div>

          <div class="state-bar-wrap">
            <div class="state-bar">
              <div class="state-bar-fill" id="state-bar-fill"></div>
            </div>
            <div class="state-bar-labels">
              <span>stable</span>
              <span>watch</span>
              <span>hot</span>
            </div>
          </div>

          <div class="status-strip">
            <div class="status-cell"><label>Uptime</label><strong id="uptime-val">-</strong></div>
            <div class="status-cell"><label>Load</label><strong id="status-load">-</strong></div>
            <div class="status-cell"><label>Memory</label><strong id="status-memory">-</strong></div>
          </div>
        </div>

        <div class="side-readouts">
          <div class="readout"><label>CPU temp</label><strong id="side-cpu-temp">-</strong></div>
          <div class="readout"><label>GPU temp</label><strong id="side-gpu-temp">-</strong></div>
          <div class="readout"><label>Processes</label><strong id="side-proc">-</strong></div>
        </div>
      </div>
    </div>

    <div class="zone">
      <div class="zone-head">
        <div class="zone-title">Heat</div>
        <div class="zone-meta" id="heat-tag">-</div>
      </div>
      <div class="heat-list" id="heat-list"></div>
    </div>

    <div class="zone">
      <div class="zone-head">
        <div class="zone-title">Alerts</div>
        <div class="zone-meta" id="alert-count">0</div>
      </div>
      <div class="alert-list" id="alert-list">
        <div class="ok-line">Waiting for data</div>
      </div>
    </div>
  </section>

  <!-- Live -->
  <section class="surface surface-live">
    <div class="zone">
      <div class="zone-head">
        <div class="zone-title" id="cpu-title">Load</div>
        <div class="zone-meta" id="cpu-info">-</div>
      </div>

      <div class="load-grid">
        <div class="load-number">
          <span>CPU load</span>
          <strong id="cpu-load-val">-</strong>
          <div class="meter big" id="cpu-meter"></div>
        </div>

        <div>
          <div class="chart-wrap"><canvas class="chart" id="cpu-chart"></canvas></div>
          <div class="core-lanes" id="core-lanes"></div>
        </div>
      </div>
    </div>

    <div class="zone">
      <div class="zone-head">
        <div class="zone-title">Memory</div>
        <div class="zone-meta" id="mem-info">-</div>
      </div>

      <div class="mem-layout">
        <div>
          <div class="slab">
            <div class="slab-part" id="slab-used" style="--part:var(--green);width:0%"></div>
            <div class="slab-part" id="slab-cache" style="--part:rgba(215,189,85,.55);width:0%"></div>
            <div class="slab-part" id="slab-free" style="--part:rgba(214,218,228,.09);width:100%"></div>
          </div>

          <div class="mem-legend">
            <div class="mem-legend-item"><span class="mem-legend-dot" style="--dot:var(--green);background:var(--green)"></span><span>Used</span></div>
            <div class="mem-legend-item"><span class="mem-legend-dot" style="--dot:rgba(215,189,85,.75);background:rgba(215,189,85,.75)"></span><span>Cached</span></div>
            <div class="mem-legend-item"><span class="mem-legend-dot" style="--dot:rgba(214,218,228,.22);background:rgba(214,218,228,.22)"></span><span>Free</span></div>
          </div>

          <div class="mem-list" id="mem-list"></div>
        </div>

        <div class="load-small">
          <div class="readout"><label>1m</label><strong id="load-1">-</strong></div>
          <div class="readout"><label>5m</label><strong id="load-5">-</strong></div>
          <div class="readout"><label>15m</label><strong id="load-15">-</strong></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Details -->
  <section class="surface surface-details">
    <div class="zone">
      <div class="zone-head">
        <div class="zone-title">Processes</div>
        <div class="zone-meta" id="proc-count">-</div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-top" onclick="switchProcTab('top')">Top</button>
        <button class="tab" id="tab-all" onclick="switchProcTab('all')">All</button>
      </div>

      <div class="table-wrap" id="proc-top">
        <table>
          <thead>
            <tr><th>Name</th><th style="text-align:right">CPU</th><th style="text-align:right">RAM</th></tr>
          </thead>
          <tbody id="proc-top-body"></tbody>
        </table>
      </div>

      <div class="table-wrap" id="proc-all" style="display:none">
        <table>
          <thead>
            <tr><th>Name</th><th style="text-align:right">CPU</th><th style="text-align:right">MB</th><th style="text-align:right">MEM</th></tr>
          </thead>
          <tbody id="proc-all-body"></tbody>
        </table>
      </div>
    </div>

    <div class="zone-stack">
      <div class="zone">
        <div class="zone-head">
          <div class="zone-title">Network</div>
          <div class="zone-meta">MB/s</div>
        </div>
        <div class="net-list" id="net-list"></div>
      </div>

      <div class="zone-pair">
        <div class="zone">
          <div class="zone-head">
            <div class="zone-title">Graphics</div>
            <div class="zone-meta" id="gpu-tag">-</div>
          </div>
          <div class="gpu-list" id="gpu-list"></div>
        </div>

        <div class="zone">
          <div class="zone-head">
            <div class="zone-title">Power</div>
            <div class="zone-meta" id="power-tag">-</div>
          </div>
          <div id="power-list"></div>
        </div>
      </div>
    </div>

    <div class="zone-stack">
      <div class="zone">
        <div class="zone-head">
          <div class="zone-title">Storage</div>
          <div class="zone-meta" id="disk-tag">-</div>
        </div>
        <div class="disk-list" id="disk-list"></div>
      </div>

      <div class="zone">
        <div class="zone-head">
          <div class="zone-title">System</div>
          <div class="zone-meta" id="system-tag">-</div>
        </div>
        <div class="sys-grid" id="sys-grid"></div>
      </div>
    </div>
  </section>
</main>

<script src="./dashboard.js"></script>
</body>
</html>
