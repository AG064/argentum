name: Android emulator
# Builds the debug APK for x86_64, installs it on an Android emulator, and runs
# the UI instrumentation: the app opens, first run accepts a local server,
# Settings opens, the Back key closes Settings and the drawer without leaving
# the app, and a message reaches a fake provider on this runner and its reply
# is shown. No secrets, no provider account, nothing published.
on:
  workflow_dispatch:
  pull_request:
    branches: [development]
    paths:
      - 'crates/**'
      - 'ui/**'
      - 'platforms/android/**'
      - 'ci/pull-request/fake_provider.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android-emulator.yml'
permissions:
  contents: read
concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      FAKE_PORT: '18080'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: x86_64-linux-android
      - name: Install the pinned NDK and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build the debug APK and the test APK
        working-directory: platforms/android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest \
            -PuiTests=true -PdebugAbis=x86_64
      - name: Check the APKs
        run: |
          set -euo pipefail
          apk=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          abis=$(unzip -Z1 "$apk" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u)
          echo "Native ABIs: $abis"
          test "$abis" = x86_64
          ls -l "$apk" platforms/android/app/build/outputs/apk/androidTest/debug/
      - name: Start the fake provider
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          python3 ci/pull-request/fake_provider.py --port "$FAKE_PORT" \
            --port-file "$RUNNER_TEMP/fixture/port" --log "$RUNNER_TEMP/fixture/requests.jsonl" \
            > "$RUNNER_TEMP/fixture/server.log" 2>&1 &
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/fixture/port" ] && break; sleep 0.1; done
          test "$(cat "$RUNNER_TEMP/fixture/port")" = "$FAKE_PORT"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the UI tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash platforms/android/test/run-emulator-tests.sh platforms/android/app/build/outputs/apk/debug/app-debug.apk platforms/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$FAKE_PORT" "$RUNNER_TEMP/emulator"
      - name: Check what reached the fake provider
        run: |
          set -euo pipefail
          grep -F 'Hello from the Argentum emulator test' "$RUNNER_TEMP/fixture/requests.jsonl" > /dev/null
          echo "Requests received: $(wc -l < "$RUNNER_TEMP/fixture/requests.jsonl")"
      - name: Keep the emulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-emulator-evidence
          path: |
            ${{ runner.temp }}/emulator
            ${{ runner.temp }}/fixture/server.log
          if-no-files-found: warn
          retention-days: 14
