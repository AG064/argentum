name: Android CI

on:
  push:
    branches:
      - main
      - development
      - feature/**
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          cat android/local.properties
          ls -la "${ANDROID_HOME}" 2>/dev/null || ls -la /opt/android-sdk 2>/dev/null || echo "SDK dir not found"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle/
            android/app/build/
          key: ${{ runner.os }}-android-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Test and build debug APK
        run: |
          echo "=== Gradle version ==="
          cd android && ./gradlew --version
          echo "=== Testing and building debug APK ==="
          ./gradlew test assembleDebug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: argentum-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
