name: Android CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Debug Environment
        run: |
          echo "=== Environment vars ==="
          printenv | grep -i android || echo "No ANDROID vars found"
          echo "=== Check common SDK paths ==="
          for p in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/opt/android-sdk" "$HOME/android-sdk" "/usr/local/android-sdk"; do
            if [ -n "$p" ] && [ -d "$p" ]; then
              echo "Found SDK at: $p"
              ls "$p"
            fi
          done

      - name: Create local.properties
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          elif [ -d "/opt/android-sdk" ]; then
            echo "sdk.dir=/opt/android-sdk" > android/local.properties
          else
            echo "sdk.dir=$HOME/android-sdk" > android/local.properties
          fi
          cat android/local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle/
            android/app/build/
          key: ${{ runner.os }}-android-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: argentum-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
