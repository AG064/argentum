name: Android CI

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        id: android-sdk
        uses: android-actions/setup-android@v3

      - name: Debug SDK Location
        run: |
          echo "Step outputs: ${{ steps.android-sdk.outputs.* }}"
          echo "ANDROID_HOME='$ANDROID_HOME'"
          echo "ANDROID_SDK_ROOT='$ANDROID_SDK_ROOT'"
          for dir in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "/opt/android-sdk" "$HOME/android-sdk"; do
            if [ -n "$dir" ] && [ -d "$dir" ]; then
              echo "SDK found at: $dir"
              ls "$dir"
              echo "sdk.dir=$dir" > android/local.properties
              exit 0
            fi
          done
          echo "ERROR: No SDK found"
          find / -name "platforms" -type d 2>/dev/null | head -5

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      - name: Cache Android build outputs
        uses: actions/cache@v4
        with:
          path: |
            android/.gradle/
            android/app/build/
          key: ${{ runner.os }}-android-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-build-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: argentum-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
