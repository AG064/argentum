name: Desktop Builds

on:
  push:
    branches: [main, development]
    tags:
      - "v*"
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-build:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-22.04
            artifact: argentum-desktop-linux
            args: ""
            rust-targets: ""
          - name: windows
            platform: windows-2022
            artifact: argentum-desktop-windows
            args: ""
            rust-targets: ""
          - name: macos-aarch64
            platform: macos-latest
            artifact: argentum-desktop-macos-aarch64
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - name: macos-x86_64
            platform: macos-15-intel
            artifact: argentum-desktop-macos-x86_64
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
          - name: android
            platform: ubuntu-22.04
            artifact: argentum-desktop-android
            args: "--target aarch64-linux-android"
            rust-targets: "aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android"
            is-android: true

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - uses: actions/setup-node@670825a89dc0abd596e7a3abd0f5e3f6e5faf37c
        with:
          node-version: "20"
          cache: npm

      - name: Install Visual Studio Build Tools (Windows)
        if: matrix.platform == 'windows-2022'
        run: |
          choco install visualstudio2022buildtools -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup JDK 17 for Android
        if: matrix.is-android == true
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        if: matrix.is-android == true
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install required Android packages
        if: matrix.is-android == true
        run: |
          echo "Installing Android packages..."
          sdkmanager --list 2>/dev/null | grep -E "ndk;|platforms;|build-tools;" | head -20
          
          retry_count=0
          max_retries=3
          while [ $retry_count -lt $max_retries ]; do
            echo "Attempt $((retry_count + 1))/$max_retries to install Android packages..."
            if sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724" 2>&1; then
              echo "Android packages installed successfully"
              break
            fi
            retry_count=$((retry_count + 1))
            echo "Failed, retrying in 15 seconds..."
            sleep 15
          done
          
          echo "Listing installed packages:"
          sdkmanager --list_installed 2>/dev/null | head -20
          
          echo "Checking NDK:"
          ls -la $ANDROID_HOME/ndk/ 2>/dev/null | head -10 || echo "NDK not found at $ANDROID_HOME/ndk/"

      - name: Set Android environment
        if: matrix.is-android == true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          sdkmanager --list_installed 2>/dev/null | head -15

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify version sync
        run: npm run version:check

      - name: Build TypeScript
        run: npm run build

      - name: Build desktop CLI sidecar
        run: npm run build:desktop-sidecar

      - name: Build desktop bundle
        run: |
          if [ "${{ matrix.name }}" == "android" ]; then
            echo "=== Android Build ==="
            echo "ANDROID_HOME: $ANDROID_HOME"
            echo "ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
            echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
            
            # NDK 29 has aarch64-linux-android24-clang compilers directly
            # Verify the actual NDK version and compiler names available
            NDK_TOOLCHAIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
            echo "NDK toolchain: $NDK_TOOLCHAIN"
            ls "$NDK_TOOLCHAIN" 2>/dev/null | grep -E "aarch64-linux-android|clang" | head -20
            
            # NDK 29 uses API-level suffixed compilers (e.g., aarch64-linux-android24-clang)
            # The Tauri build system expects these to be available
            # Set CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER to the correct compiler
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/aarch64-linux-android24-clang"
            export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_TOOLCHAIN/armv7a-linux-androideabi24-clang"
            export CARGO_TARGET_I686_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/i686-linux-android24-clang"
            export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_TOOLCHAIN/x86_64-linux-android24-clang"
            
            echo "=== Using NDK compilers ==="
            echo "AARCH64: $CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
            ls -la "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER" 2>/dev/null || echo "Compiler not found"
            
            # Build Android sidecar stubs for ALL architectures (pkg doesn't support Android)
            mkdir -p src/desktop/binaries
            printf 'int main() { return 0; }' > /tmp/stub.c
            # Compile stubs for all Android targets
            "$NDK_TOOLCHAIN/aarch64-linux-android24-clang" /tmp/stub.c -o src/desktop/binaries/argentum-cli-aarch64-linux-android
            "$NDK_TOOLCHAIN/armv7a-linux-androideabi24-clang" /tmp/stub.c -o src/desktop/binaries/argentum-cli-armv7-linux-androideabi
            "$NDK_TOOLCHAIN/i686-linux-android24-clang" /tmp/stub.c -o src/desktop/binaries/argentum-cli-i686-linux-android
            "$NDK_TOOLCHAIN/x86_64-linux-android24-clang" /tmp/stub.c -o src/desktop/binaries/argentum-cli-x86_64-linux-android
            
            # Create minimal package.json for Android build (Gradle needs "npm run tauri" to work)
            printf '{"name":"argentum-desktop","scripts":{"tauri":"../../node_modules/.bin/tauri"}}' > src/desktop/package.json
            
            # Initialize Android project and build APK
            cd src/desktop && npx tauri android init --ci 2>&1 | tail -50 && npx tauri android build 2>&1 | tail -150
            
            echo "=== Build output ==="
            find src/desktop/target -name "*.apk" 2>/dev/null | head -10 || true
            find src/desktop/target -name "*.aab" 2>/dev/null | head -10 || true
            find src/desktop/gen/android -name "*.apk" 2>/dev/null | head -10 || true
          else
            npm run desktop:build --ignore-scripts -- ${{ matrix.args }}
          fi
        shell: bash

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src/desktop/target/release/bundle/**/*.AppImage
            src/desktop/target/release/bundle/**/*.deb
            src/desktop/target/release/bundle/**/*.rpm
            src/desktop/target/release/bundle/**/*.dmg
            src/desktop/target/release/bundle/**/*.msi
            src/desktop/target/release/bundle/**/*-setup.exe
            src/desktop/target/*/release/bundle/**/*.dmg
            src/desktop/target/*/release/bundle/**/*.apk
            src/desktop/target/*/release/bundle/android/**/*.apk
            src/desktop/gen/android/app/build/outputs/apk/**/*.apk

  desktop-release:
    name: Attach desktop installers to release
    runs-on: ubuntu-latest
    needs: desktop-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          path: artifacts/desktop

      - name: Remove non-installer release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.data.id,
              per_page: 100,
            });
            const keepers = [
              /^argentum-v\d+\.\d+\.\d+-linux-x64$/,
              /^argentum-v\d+\.\d+\.\d+-macos-x64$/,
              /^argentum-cli-v\d+\.\d+\.\d+-win-x64\.exe$/,
              /^SHA256SUMS(?:-portable)?\.txt$/,
              /^Argentum[_-]\d+\.\d+\.\d+.*\.(?:AppImage|deb|rpm|dmg|msi|exe|apk)$/,
            ];
            for (const asset of assets) {
              if (keepers.some((pattern) => pattern.test(asset.name))) {
                continue;
              }
              core.info(`Deleting non-installer release asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

      - uses: softprops/action-gh-release@403a5240f3837fa857f642062e05aad6bb3391ca
        with:
          overwrite_files: true
          files: |
            artifacts/desktop/**/*.AppImage
            artifacts/desktop/**/*.deb
            artifacts/desktop/**/*.rpm
            artifacts/desktop/**/*.dmg
            artifacts/desktop/**/*.msi
            artifacts/desktop/**/*-setup.exe
            artifacts/desktop/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
