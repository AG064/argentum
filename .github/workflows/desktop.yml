name: Desktop Builds

on:
  push:
    branches: [main, development]
    tags:
      - "v*"
  pull_request:
    branches: [main, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-build:
    name: Desktop ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-22.04
            artifact: argentum-desktop-linux
            args: ""
            rust-targets: ""
          - name: windows
            platform: windows-2022
            artifact: argentum-desktop-windows
            args: ""
            rust-targets: ""
          - name: macos-aarch64
            platform: macos-latest
            artifact: argentum-desktop-macos-aarch64
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - name: macos-x86_64
            platform: macos-15-intel
            artifact: argentum-desktop-macos-x86_64
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
          # Android is built separately by the `android-apk` job in
          # release.yml (and android.yml for the dev/debug APK). The Tauri
          # driver path we used to use here was fragile — it manually
          # generated sidecar C stubs, called `npx tauri android init` on
          # every run, and shelled out to the gradle wrapper. A direct
          # `cd android && ./gradlew assembleRelease` is far simpler and
          # more reliable.

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - uses: actions/setup-node@670825a89dc0abd596e7a3abd0f5e3f6e5faf37c
        with:
          node-version: "20"
          cache: npm

      - name: Install Visual Studio Build Tools (Windows)
        if: matrix.platform == 'windows-2022'
        run: |
          choco install visualstudio2022buildtools -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify version sync
        run: npm run version:check

      - name: Verify desktop frontend assets
        run: npm run desktop-assets:check

      - name: Build TypeScript
        run: npm run build

      - name: Build desktop CLI sidecar
        run: npm run build:desktop-sidecar

      - name: Build desktop bundle
        run: |
          npm run desktop:build --ignore-scripts -- ${{ matrix.args }}
        shell: bash

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src/desktop/target/release/bundle/**/*.AppImage
            src/desktop/target/release/bundle/**/*.deb
            src/desktop/target/release/bundle/**/*.rpm
            src/desktop/target/release/bundle/**/*.dmg
            src/desktop/target/release/bundle/**/*.msi
            src/desktop/target/release/bundle/**/*-setup.exe
            src/desktop/target/*/release/bundle/**/*.dmg

  desktop-release:
    name: Attach desktop installers to release
    runs-on: ubuntu-latest
    needs: desktop-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          path: artifacts/desktop

      - name: Remove non-installer release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = context.ref.replace('refs/tags/', '');
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (e) {
              if (e.status === 404) {
                core.info(`No release found for tag ${tag}, skipping cleanup.`);
                return;
              }
              throw e;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.data.id,
              per_page: 100,
            });
            const keepers = [
              /^argentum-v\d+\.\d+\.\d+-linux-x64$/,
              /^argentum-v\d+\.\d+\.\d+-macos-x64$/,
              /^argentum-v?\d+\.\d+\.\d+-android(?:-\w+)?\.apk$/,
              /^argentum-cli-v\d+\.\d+\.\d+-win-x64\.exe$/,
              /^SHA256SUMS(?:-portable)?\.txt$/,
              /^Argentum[_-]\d+\.\d+\.\d+.*\.(?:AppImage|deb|rpm|dmg|msi|exe|apk)$/,
            ];
            for (const asset of assets) {
              if (keepers.some((pattern) => pattern.test(asset.name))) {
                continue;
              }
              core.info(`Deleting non-installer release asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

      - uses: softprops/action-gh-release@403a5240f3837fa857f642062e05aad6bb3391ca
        with:
          overwrite_files: true
          files: |
            artifacts/desktop/**/*.AppImage
            artifacts/desktop/**/*.deb
            artifacts/desktop/**/*.rpm
            artifacts/desktop/**/*.dmg
            artifacts/desktop/**/*.msi
            artifacts/desktop/**/*-setup.exe
            artifacts/desktop/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
