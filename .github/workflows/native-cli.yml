name: Native CLI qualification
on:
  push:
    branches: [development, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [development, 'feature/**', 'fix/**', 'docs/**']
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 0'
permissions:
  contents: read
concurrency:
  group: native-cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-artifacts:
    # Optional local profile, no personal accounts or live model requests.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Prepare pinned dependencies and local artifact assets
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust preparation failed' }
          ./scripts/prepare-artifact-assets.ps1 -OutputDirectory "$env:RUNNER_TEMP/artifact-assets"
      - name: Check and lint optional local artifact profile
        run: |
          cargo clippy -p argentum-cli --features artifacts --all-targets --locked --offline -j 4 -- -D warnings
          cargo clippy -p argentum-artifacts --all-targets --locked --offline -j 4 -- -D warnings
      - name: Actual local artifact CLI and worker controls
        shell: pwsh
        run: |
          ./scripts/test-local-artifacts-offline.ps1 -OutputDirectory "$env:RUNNER_TEMP/local-artifact-controls" -AssetsDirectory "$env:RUNNER_TEMP/artifact-assets" -CiNullAccess
          cargo test -p argentum-runtime --features extensions --lib extensions::image_authority_tests --locked --offline -j 4 -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Image authority controls failed' }
      - name: Retain synthetic artifact evidence, not a release
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: optional-local-artifact-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/local-artifact-controls
          if-no-files-found: warn
          retention-days: 14
  extensions:
    # Separate optional feature qualification, never the core RC artifact.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Populate pinned Rust dependencies
        run: cargo fetch --locked
      - name: Check and lint optional feature
        run: |
          cargo clippy -p argentum-cli --features extensions --all-targets --locked --offline -j 4 -- -D warnings
          cargo clippy -p argentum-cli --features desktop-control --all-targets --locked --offline -j 4 -- -D warnings
      - name: Prepare pinned isolated browser controls
        shell: pwsh
        run: |
          Push-Location extensions/browser
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency preparation failed' }
            $env:PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP/argentum-browser-cache"
            npx --no-install playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Pinned browser preparation failed' }
          } finally { Pop-Location }
      - name: Real browser and native CLI controls without credentials
        shell: pwsh
        run: |
          $env:ARGENTUM_PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP/argentum-browser-cache"
          $node = (Get-Command node -CommandType Application).Source
          & $node --test extensions/browser/adapter.test.mjs extensions/browser/browser-controls.test.mjs extensions/browser/capture-freshness-controls.test.mjs extensions/browser/preview-auth-controls.test.mjs extensions/browser/completion-controls.test.mjs extensions/browser/reload-focus-controls.test.mjs extensions/browser/reviewed-stylesheet-controls.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser controls failed' }
          ./scripts/test-extensions-offline.ps1 -OutputDirectory "$env:RUNNER_TEMP/extension-cli-tests" -Node $node -BrowserCache $env:ARGENTUM_PLAYWRIGHT_BROWSERS_PATH -Jobs 4
      - name: Retain synthetic feature evidence, not a release
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: optional-extension-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/extension-cli-tests
          if-no-files-found: warn
          retention-days: 14
  windows-process-boundary:
    # Both hosted runner generations reproduced the restricted-child failure.
    # Explicit owner-approved disposable NUL-only setup; restore before return.
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Populate pinned dependencies
        run: cargo fetch --locked
      - name: Offline CI NUL lifecycle controls
        shell: pwsh
        run: ./scripts/test-ci-null-scope.ps1 -OutputDirectory "$env:RUNNER_TEMP/null-controls"
      - name: Fresh process boundary diagnostics
        shell: pwsh
        run: ./scripts/test-process-boundary.ps1 -OutputDirectory "$env:RUNNER_TEMP/process-boundary" -CiNullAccess
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: process-boundary-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/process-boundary/diagnostics
            ${{ runner.temp }}/null-controls/results.json
          if-no-files-found: warn
          retention-days: 14
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Populate pinned dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Design system, icon, and layout rules
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow==12.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed' }
          ./scripts/validate-design-system.ps1
          ./scripts/validate-icon-system.ps1
          ./scripts/validate-mobile-design.ps1
      - name: Credential-free tests
        shell: pwsh
        run: ./scripts/test-offline.ps1 -OutputDirectory "$env:RUNNER_TEMP/offline-tests" -Jobs 4 -CiNullAccess
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -j 4 -- -D warnings
      - name: Retain bounded test diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: offline-test-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/offline-tests/diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Install pinned dependency-policy tool
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-deny@0.20.2
      - name: Advisory, source and license policy
        shell: pwsh
        run: |
          cargo deny fetch
          if ($LASTEXITCODE -ne 0) { throw 'Current dependency-policy data fetch failed' }
          $cargoRoot = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          $databases = @(Get-ChildItem -LiteralPath (Join-Path $cargoRoot 'advisory-dbs') -Directory)
          if (-not $databases.Count) { throw 'Fetched advisory database identity unavailable' }
          $revisions = @($databases | ForEach-Object {
            $revision = (& git -C $_.FullName rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Advisory revision readback failed' }
            [ordered]@{ database=$_.Name; revision=$revision }
          })
          [ordered]@{ source=$env:GITHUB_SHA; retrieved_at=[DateTime]::UtcNow.ToString('o'); databases=$revisions; policy_sha256=(Get-FileHash deny.toml).Hash.ToLowerInvariant(); lock_sha256=(Get-FileHash Cargo.lock).Hash.ToLowerInvariant() } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$env:RUNNER_TEMP/dependency-policy-inputs.json" -Encoding utf8NoBOM
          cargo deny --locked --offline check
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency policy failed' }
      - name: Retain dependency-policy input identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-policy-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/dependency-policy-inputs.json
          if-no-files-found: warn
          retention-days: 14
  windows-packages:
    # Optimized package builds take close to an hour, so they run weekly and on
    # demand. The Release workflow builds the published files from each tag.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
      - name: Populate pinned dependencies
        run: cargo fetch --locked
      - name: Prepare unsigned CLI package only
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: 'true'
        run: ./scripts/package-windows-cli.ps1 -Jobs 4 -OutputDirectory "$env:RUNNER_TEMP/native-cli-package"
      - name: Prepare unsigned optional desktop successor only
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: 'true'
        run: ./scripts/package-windows-cli.ps1 -DesktopControl -Jobs 4 -OutputDirectory "$env:RUNNER_TEMP/native-desktop-package"
      - name: Prepare unsigned optional local artifact successor only
        shell: pwsh
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          ./scripts/prepare-artifact-assets.ps1 -OutputDirectory "$env:RUNNER_TEMP/package-artifact-assets"
          ./scripts/package-windows-cli.ps1 -DesktopControl -Artifacts -ArtifactAssets "$env:RUNNER_TEMP/package-artifact-assets" -Jobs 4 -OutputDirectory "$env:RUNNER_TEMP/native-local-artifact-package"
      - name: Retain build evidence, not a public release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-cli-windows-x64-unsigned
          path: ${{ runner.temp }}/native-cli-package
          if-no-files-found: error
          retention-days: 14
      - name: Retain optional desktop build evidence, not a public release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-cli-windows-x64-desktop-unsigned
          path: ${{ runner.temp }}/native-desktop-package
          if-no-files-found: error
          retention-days: 14
      - name: Retain optional local artifact build evidence, not a public release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-cli-windows-x64-local-artifacts-unsigned
          path: ${{ runner.temp }}/native-local-artifact-package
          if-no-files-found: error
          retention-days: 14
