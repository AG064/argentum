name: Native CLI qualification
on:
  push:
    branches: [development, 'codex/**']
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  extensions:
    # Separate optional feature qualification, never the core RC artifact.
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Populate pinned Rust dependencies
        run: cargo fetch --locked
      - name: Check and lint optional feature
        run: |
          cargo check -p argentum-cli --features extensions --all-targets --locked -j 2
          cargo clippy -p argentum-cli --features extensions --all-targets --locked -j 2 -- -D warnings
      - name: Prepare pinned isolated browser controls
        shell: pwsh
        run: |
          Push-Location extensions/browser
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency preparation failed' }
            $env:PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP/argentum-browser-cache"
            npx --no-install playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Pinned browser preparation failed' }
          } finally { Pop-Location }
      - name: Real browser and native CLI controls without credentials
        shell: pwsh
        run: |
          $env:ARGENTUM_PLAYWRIGHT_BROWSERS_PATH = "$env:RUNNER_TEMP/argentum-browser-cache"
          $node = (Get-Command node -CommandType Application).Source
          & $node --test extensions/browser/adapter.test.mjs extensions/browser/browser-controls.test.mjs extensions/browser/preview-auth-controls.test.mjs extensions/browser/completion-controls.test.mjs extensions/browser/reload-focus-controls.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser controls failed' }
          ./scripts/test-extensions-offline.ps1 -OutputDirectory "$env:RUNNER_TEMP/extension-cli-tests" -Node $node -BrowserCache $env:ARGENTUM_PLAYWRIGHT_BROWSERS_PATH -Jobs 2
      - name: Retain synthetic feature evidence, not a release
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-extension-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/extension-cli-tests
          if-no-files-found: warn
          retention-days: 14
  windows-process-boundary:
    # Both hosted runner generations reproduced the restricted-child failure.
    # Explicit owner-approved disposable NUL-only setup; restore before return.
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Populate pinned dependencies
        run: cargo fetch --locked
      - name: Offline CI NUL lifecycle controls
        shell: pwsh
        run: ./scripts/test-ci-null-scope.ps1 -OutputDirectory "$env:RUNNER_TEMP/null-controls"
      - name: Fresh process boundary diagnostics
        shell: pwsh
        run: ./scripts/test-process-boundary.ps1 -OutputDirectory "$env:RUNNER_TEMP/process-boundary" -CiNullAccess
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: process-boundary-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/process-boundary/diagnostics
            ${{ runner.temp }}/null-controls/results.json
          if-no-files-found: warn
          retention-days: 14
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Populate pinned dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check native workspace
        run: cargo check --workspace --all-targets --locked -j 2
      - name: Credential-free tests
        shell: pwsh
        run: ./scripts/test-offline.ps1 -OutputDirectory "$env:RUNNER_TEMP/offline-tests" -Jobs 2 -CiNullAccess
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --locked -j 2 -- -D warnings
      - name: Retain bounded test diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-test-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/offline-tests/diagnostics
          if-no-files-found: warn
          retention-days: 14
      - name: Install pinned dependency-policy tool
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Advisory, source and license policy
        run: cargo deny check
      - name: Prepare unsigned CLI package only
        shell: pwsh
        run: ./scripts/package-windows-cli.ps1 -OutputDirectory "$env:RUNNER_TEMP/native-cli-package"
      - name: Retain build evidence, not a public release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-cli-windows-x64-unsigned
          path: ${{ runner.temp }}/native-cli-package
          if-no-files-found: error
          retention-days: 14
