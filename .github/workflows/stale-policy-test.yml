name: Stale policy controls
on:
  pull_request:
    paths: [.github/workflows/stale.yml, .github/workflows/stale-policy-test.yml, .github/tests/stale_policy_test.py]
  push:
    branches: [development]
    paths: [.github/workflows/stale.yml, .github/workflows/stale-policy-test.yml, .github/tests/stale_policy_test.py]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python .github/tests/stale_policy_test.py
