name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      
      - name: Setup Node.js
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Version sync check
        run: npm run version:check
      
      - name: TypeScript check
        run: npm run typecheck
      
      - name: ESLint
        run: npm run lint
      
      - name: Prettier check
        run: npm run format:check || true

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      
      - name: Setup Node.js
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          CI: true

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      
      - name: Setup Node.js
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Visual Studio Build Tools (Windows)
        if: matrix.os == 'windows-2022'
        run: |
          choco install visualstudio2022buildtools -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify build output
        run: node -e "const fs=require('fs');if(!fs.existsSync('dist/index.js'))throw new Error('dist/index.js not found');"

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      
      - name: Setup Node.js
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install
        run: npm ci --legacy-peer-deps
      
      - name: Build
        run: npm run build
      
      - name: Integration tests
        run: npm run test:integration
        env:
          CI: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      
      - name: Setup Node.js
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install
        run: npm ci --legacy-peer-deps
      
      - name: Security audit
        run: npm audit --omit=dev --audit-level=moderate
      
      - name: Snyk (if available)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npx snyk test

  onboarding-smoke:
    name: Onboarding Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Setup Node.js
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Verify non-interactive onboarding
        run: |
          mkdir -p "$RUNNER_TEMP/argentum-onboarding"
          cd "$RUNNER_TEMP/argentum-onboarding"
          node "$GITHUB_WORKSPACE/dist/cli.js" onboard --yes
          node "$GITHUB_WORKSPACE/dist/cli.js" doctor

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      
      - name: Build Docker image
        run: |
          docker build -t argentum:test -f docker/Dockerfile .
          docker run argentum:test --version || true
      
      - name: Verify Docker
        run: |
          docker images argentum:test
          test "$(docker images argentum:test -q | wc -l)" -gt 0

  installation-test:
    name: Installation Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        install_method: [npm, docker, binary]
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      
      - name: NPM install
        if: matrix.install_method == 'npm'
        run: |
          npm ci --legacy-peer-deps
          npm run build
          ./dist/index.js --version || true
      
      - name: Docker install
        if: matrix.install_method == 'docker'
        run: |
          # Retry Docker build up to 3 times to handle transient network issues
          for i in 1 2 3; do
            echo "Docker build attempt $i..."
            if docker build -t argentum:test -f docker/Dockerfile .; then
              echo "Docker build succeeded on attempt $i"
              break
            fi
            echo "Docker build failed, retrying in10 seconds..."
            sleep 10
          done
          docker run argentum:test --version || true
      
      - name: Binary install
        if: matrix.install_method == 'binary'
        run: |
          # Simulate binary download and test
          echo "Binary installation test"
          echo "Binary simulation complete"

  lint-all-branches:
    name: Lint All Branches
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      
      - name: Setup Node.js
        uses: actions/setup-node@f4a67bbeca970f103397d3d2b9462cf787cd2980
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install
        run: npm ci --legacy-peer-deps
      
      - name: Full lint check
        run: |
          npm run lint
          npm run typecheck
          npm run format:check || true
