name: Gradle wrapper
# Checks that the committed gradle-wrapper.jar is an official Gradle release.
on:
  # Every push, so the validation always covers the latest commit.
  push:
    branches: [development]
  pull_request:
    paths: ['platforms/android/gradle/wrapper/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
