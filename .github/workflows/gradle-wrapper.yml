name: Gradle wrapper
# Checks that the committed gradle-wrapper.jar is an official Gradle release.
on:
  push:
    branches: [development]
    paths: ['platforms/android/gradle/wrapper/**']
  pull_request:
    paths: ['platforms/android/gradle/wrapper/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
