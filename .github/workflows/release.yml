name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-binaries:
    name: Portable CLI binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Install executable packager
        run: npm install -g @yao-pkg/pkg@6.6.0

      - name: Build portable release binaries
        shell: bash
        run: |
          mkdir -p artifacts/release
          pkg --config package.json dist/cli.js --targets node18-linux-x64 --output "artifacts/release/argentum-v${{ steps.package.outputs.version }}-linux-x64" --compress GZip --no-bytecode --public-packages "*" --public
          pkg --config package.json dist/cli.js --targets node18-win-x64 --output "artifacts/release/argentum-cli-v${{ steps.package.outputs.version }}-win-x64.exe" --compress GZip --no-bytecode --public-packages "*" --public
          pkg --config package.json dist/cli.js --targets node18-macos-x64 --output "artifacts/release/argentum-v${{ steps.package.outputs.version }}-macos-x64" --compress GZip --no-bytecode --public-packages "*" --public

      - name: Smoke test Linux binary
        run: ./artifacts/release/argentum-v${{ steps.package.outputs.version }}-linux-x64 --version

      - name: Prepare release notes
        shell: bash
        run: |
          notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_path" ]; then
            cp "$notes_path" RELEASE_NOTES.md
          else
            {
              echo "# Argentum ${GITHUB_REF_NAME}"
              echo
              echo "Automated release for ${GITHUB_REF_NAME}."
              echo
              echo "See the attached artifacts and checksum files below."
            } > RELEASE_NOTES.md
          fi

      - name: Write portable checksums
        shell: bash
        run: |
          cd artifacts/release
          sha256sum argentum-v${{ steps.package.outputs.version }}-linux-x64 argentum-cli-v${{ steps.package.outputs.version }}-win-x64.exe argentum-v${{ steps.package.outputs.version }}-macos-x64 > SHA256SUMS-portable.txt

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: argentum-portable-binaries
          path: |
            artifacts/release/argentum-v*-linux-x64
            artifacts/release/argentum-cli-v*-win-x64.exe
            artifacts/release/argentum-v*-macos-x64
            artifacts/release/SHA256SUMS-portable.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Argentum ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          files: |
            artifacts/release/argentum-v*-linux-x64
            artifacts/release/argentum-cli-v*-win-x64.exe
            artifacts/release/argentum-v*-macos-x64
            artifacts/release/SHA256SUMS-portable.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-apk:
    name: Android release APK
    runs-on: ubuntu-latest
    needs: portable-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties

      - name: Generate CI keystore
        if: ${{ !secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          # Generate a deterministic keystore inside the workflow. This is a
          # long-lived signing identity baked into the repository's releases
          # and is appropriate for sideloading and personal use.
          #
          # To use your own keystore (recommended for Play Store publishing),
          # add these repository secrets:
          #   ANDROID_KEYSTORE_BASE64   - base64-encoded release.keystore file
          #   ANDROID_KEYSTORE_PASSWORD - keystore password
          #   ANDROID_KEY_ALIAS         - key alias
          #   ANDROID_KEY_PASSWORD      - key password
          cd android/app
          mkdir -p keystore
          KEYSTORE=keystore/release.keystore
          ALIAS=argentum
          STORE_PASS=argentum-ci-store
          KEY_PASS=argentum-ci-key
          CN="CN=Argentum CI, OU=Argentum, O=AG064, L=Tallinn, S=Harju, C=EE"
          keytool -genkey -noprompt \
            -keystore "$KEYSTORE" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10950 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "$CN"
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          EOF
          echo "CI keystore generated."

      - name: Decode user keystore from secret
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          cd android/app
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          cat > keystore.properties <<EOF
          storeFile=keystore/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        shell: bash
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease --stacktrace
          echo "--- APK output ---"
          find app/build/outputs/apk/release -type f -name "*.apk" -exec ls -la {} \;

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi
          # apksigner is part of the build-tools
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "apksigner not available, falling back to aapt"
            AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | head -n 1)
            "$AAPT" dump badging "$APK" | head -n 5
          fi

      - name: Stage release APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          mkdir -p artifacts/android
          cp "$APK" "artifacts/android/argentum-${{ steps.package.outputs.version }}-android.apk"
          sha256sum "artifacts/android/argentum-${{ steps.package.outputs.version }}-android.apk" > artifacts/android/SHA256SUMS-android.txt
          ls -la artifacts/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: argentum-android-apk
          path: artifacts/android/argentum-${{ steps.package.outputs.version }}-android.apk
          if-no-files-found: error

      - name: Upload APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/argentum-${{ steps.package.outputs.version }}-android.apk
            artifacts/android/SHA256SUMS-android.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs:
      - android-apk
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        run: echo "Release ${{ github.ref_name }} artifacts built successfully."
