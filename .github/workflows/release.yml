name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  portable-binaries:
    name: Portable CLI binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - uses: actions/setup-node@670825a89dc0abd596e7a3abd0f5e3f6e5faf37c
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npm run build

      - name: Read package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # NOTE: PinnedDependencies alert for npm packages is a known limitation.
      # npm packages cannot be pinned to Git commit SHAs like GitHub Actions can.
      # The version is pinned (6.6.0) but there's no SHA URL mechanism for npm.
      - name: Install executable packager
        run: npm install -g @yao-pkg/pkg@6.6.0

      - name: Build portable release binaries
        shell: bash
        run: |
          mkdir -p artifacts/release
          pkg --config package.json dist/cli.js --targets node18-linux-x64 --output "artifacts/release/argentum-v${{ steps.package.outputs.version }}-linux-x64" --compress GZip --no-bytecode --public-packages "*" --public
          pkg --config package.json dist/cli.js --targets node18-win-x64 --output "artifacts/release/argentum-cli-v${{ steps.package.outputs.version }}-win-x64.exe" --compress GZip --no-bytecode --public-packages "*" --public
          pkg --config package.json dist/cli.js --targets node18-macos-x64 --output "artifacts/release/argentum-v${{ steps.package.outputs.version }}-macos-x64" --compress GZip --no-bytecode --public-packages "*" --public

      - name: Smoke test Linux binary
        run: ./artifacts/release/argentum-v${{ steps.package.outputs.version }}-linux-x64 --version

      - name: Run Trivy vulnerability scanner on artifacts
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: 'fs'
          scan-ref: 'artifacts/release'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check Trivy results
        run: |
          if [ -f trivy-results.sarif ] && grep -q '"level":"error"' trivy-results.sarif; then
            echo "Critical/High vulnerabilities found!"
            echo "Please fix vulnerabilities before releasing."
            cat trivy-results.sarif | jq '.runs[0].results | length'
            exit 1
          fi
          echo "No critical/high vulnerabilities found in release artifacts."

      - name: Prepare release notes
        shell: bash
        run: |
          notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_path" ]; then
            cp "$notes_path" RELEASE_NOTES.md
          else
            {
              echo "# Argentum ${GITHUB_REF_NAME}"
              echo
              echo "Automated release for ${GITHUB_REF_NAME}."
              echo
              echo "See the attached artifacts and checksum files below."
            } > RELEASE_NOTES.md
          fi

      - name: Write portable checksums
        shell: bash
        run: |
          cd artifacts/release
          sha256sum argentum-v${{ steps.package.outputs.version }}-linux-x64 argentum-cli-v${{ steps.package.outputs.version }}-win-x64.exe argentum-v${{ steps.package.outputs.version }}-macos-x64 > SHA256SUMS-portable.txt

      - name: Install cosign for signing
        uses: sigstore/cosign-installer@9e9e0b19f5d9a6c3a8a5a2f5a5e6b5c3a8a5a2f5
        with:
          cosign-release: 'v2.4.1'

      - name: Sign portable binaries with Sigstore
        shell: bash
        run: |
          for f in artifacts/release/argentum-v*${{ steps.package.outputs.version }}-linux-x64 \
                   artifacts/release/argentum-cli-v*${{ steps.package.outputs.version }}-win-x64.exe \
                   artifacts/release/argentum-v*${{ steps.package.outputs.version }}-macos-x64; do
            cosign sign-blob \
              --yes \
              --bundle "${f}.cosign-bundle" \
              "file://${f}"
          done
        env:
          COSIGN_YES: "true"

      - name: Generate SBOM for portable binaries
        uses: anchore/sbom-action@4d65c3fbb11dc9bfbef5c5d2d90e24dfa3e2eb64
        with:
          image: artifacts/release/argentum-v${{ steps.package.outputs.version }}-linux-x64
          format: cyclonedx-json
          output-file: artifacts/release/argentum-${{ steps.package.outputs.version }}-sbom.json
          attest: false

      - name: Upload portable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: argentum-portable-binaries
          path: |
            artifacts/release/argentum-v*-linux-x64
            artifacts/release/argentum-cli-v*-win-x64.exe
            artifacts/release/argentum-v*-macos-x64
            artifacts/release/SHA256SUMS-portable.txt

      - uses: softprops/action-gh-release@403a5240f3837fa857f642062e05aad6bb3391ca
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Argentum ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          files: |
            artifacts/release/argentum-v*-linux-x64
            artifacts/release/argentum-cli-v*-win-x64.exe
            artifacts/release/argentum-v*-macos-x64
            artifacts/release/SHA256SUMS-portable.txt
            artifacts/release/*.cosign-bundle
            artifacts/release/*-sbom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    needs:
      - portable-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Notify success
        run: echo "Release ${{ github.ref_name }} artifacts built successfully."
