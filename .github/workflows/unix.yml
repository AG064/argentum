name: Linux and macOS
# Builds and tests the workspace, the desktop app and the CLI on Linux x64 and
# macOS (Apple silicon and Intel). It needs no secrets and publishes nothing.
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          cache-on-failure: true
          key: ${{ matrix.name }}
      - name: Install the Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev xvfb
      - name: Populate pinned dependencies
        run: cargo fetch --locked
      - name: Build every crate and test
        run: cargo build --workspace --all-targets --locked --offline --keep-going
      - name: Strict Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked --offline --keep-going -- -D warnings
      # The UI tests open a window. Linux runners have no display, so they get a
      # virtual one; macOS runners have a desktop session.
      - name: Tests
        if: ${{ !cancelled() }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then wrap='xvfb-run -a'; else wrap=''; fi
          $wrap cargo test --workspace --locked --offline --no-fail-fast
