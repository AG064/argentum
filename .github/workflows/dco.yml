#
# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off from its author (git commit -s), as CONTRIBUTING.md asks. The branch
# ruleset requires this check, so a pull request without it cannot be merged.
name: DCO

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  sign-off:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git show -s --format='%an <%ae>' "$commit")"
            if git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" \
                | grep -qxF -- "$author"; then
              echo "ok      $commit $author"
            else
              echo "missing $commit: no 'Signed-off-by: $author' line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with git commit -s. To fix existing commits: git rebase --signoff $BASE" >&2
            exit 1
          fi
