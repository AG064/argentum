name: Release build
# Builds release files and records signed build provenance. It never creates a
# tag or publishes a release. A maintainer attaches the files to a release.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Build the desktop app
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow==12.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Pillow install failed' }
          ./scripts/build-windows-release.ps1
      - name: Build the CLI packages
        shell: pwsh
        run: |
          ./scripts/package-windows-cli.ps1 -OutputDirectory "$env:RUNNER_TEMP/cli"
          ./scripts/package-windows-cli.ps1 -DesktopControl -Jobs 1 -OutputDirectory "$env:RUNNER_TEMP/cli-desktop"
      - name: Assemble release files
        shell: pwsh
        run: python scripts/package-windows-release.py --output release-assets --cli "$env:RUNNER_TEMP/cli" --cli-desktop "$env:RUNNER_TEMP/cli-desktop"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        id: attest
        with:
          subject-path: release-assets/*
      # Shipped with the release so anyone can check where each file came from.
      - name: Add the provenance bundle
        shell: pwsh
        run: Copy-Item '${{ steps.attest.outputs.bundle-path }}' release-assets/provenance.intoto.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: argentum-release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 30
