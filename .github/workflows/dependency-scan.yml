name: Dependency Security Scan

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - uses: actions/setup-node@670825a89dc0abd596e7a3abd0f5e3f6e5faf37c
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-dependencies.sarif'
          security-checks: 'vuln'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-dependencies.sarif'

      - name: Check for critical vulnerabilities
        run: |
          echo "=== Debug ==="
          if [ -f trivy-dependencies.sarif ]; then
            echo "File exists, size: $(wc -c < trivy-dependencies.sarif)"
          else
            echo "File does not exist"
          fi
          echo "Listing all files in current dir:"
          ls -la *.sarif 2>/dev/null || echo "No sarif files"
          echo "=== End Debug ==="