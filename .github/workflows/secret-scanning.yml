name: Secret Scanning

on:
  push:
    branches: [main, master, develop, development]
  pull_request:
    branches: [main, master, develop, development]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          fetch-depth: 1

      - name: Prepare committed tree
        run: |
          mkdir gitleaks-scan
          git archive --format=tar HEAD | tar -x -C gitleaks-scan

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD/gitleaks-scan:/scan:ro" \
            -v "$PWD:/out" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            dir /scan \
            --redact \
            --verbose \
            --exit-code 2 \
            --report-format sarif \
            --report-path /out/results.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gitleaks-results
          path: results.sarif
          if-no-files-found: ignore
