name: Check npm version

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-npm:
    name: Check npm version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Get current pinned npm version
        id: current
        run: |
          CURRENT=$(grep 'npm@[0-9]' docker/Dockerfile | sed 's/.*npm@\([0-9.]*\).*/\1/')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current npm version: $CURRENT"

      - name: Check latest npm version
        id: latest
        run: |
          LATEST=$(curl -sL https://registry.npmjs.org/npm/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest npm version: $LATEST"

      - name: Create issue if update available
        if: steps.current.outputs.current != steps.latest.outputs.latest
        run: |
          CURRENT="${{ steps.current.outputs.current }}"
          LATEST="${{ steps.latest.outputs.latest }}"
          
          ISSUE_TITLE="Update npm to $LATEST"
          ISSUE_BODY="## npm Update Available

Current pinned version: **$CURRENT**
Latest available: **$LATEST**

Update in \`docker/Dockerfile\`:
\`\`\`dockerfile
- RUN npm install -g npm@$CURRENT
+ RUN npm install -g npm@$LATEST
\`\`\`

This update may include security patches for bundled packages (ip-address, picomatch, brace-expansion)."

          # Check if issue already exists
          EXISTING=$(curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=npm-update" \
            | python3 -c "import json,sys; issues=json.load(sys.stdin); print(any('npm@$LATEST' in i['title'] for i in issues) if isinstance(issues, list) else 'false')")
          
          if [ "$EXISTING" = "false" ]; then
            curl -sL -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d "{\"title\":\"$ISSUE_TITLE\",\"body\":\"$ISSUE_BODY\",\"labels\":[\"npm-update\",\"dependencies\"]}"
            echo "Created issue for npm $LATEST"
          else
            echo "Issue for npm $LATEST already exists"
          fi