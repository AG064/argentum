name: Security Scorecard

on:
  push:
    branches: [development]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
      - uses: ossf/scorecard-action@af76153369ae1eb1eaffc4118046b7fda9a8419e
        with:
          results_file: results.sarif
          results_format: sarif
      - uses: github/codeql-action/upload-sarif@f3f1edbedfb4a1d188d344570834df2996d45d39
        with:
          sarif_file: results.sarif
          category: scorecard
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: scorecard-results
          path: results.sarif
