name: CodeQL
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    # The development ruleset requires this exact check name.
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26
        with:
          languages: rust,actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26
