[package]
name = "argentum-execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
artifact-render = []
# Disposable Linux benchmark containers only. Other desktop non-Windows builds keep
# refusing to run processes, because this is weaker than a Windows job object. Android
# always uses a process group, with the app sandbox as the outer boundary.
benchmark-process-group = ["dep:rustix"]

[dependencies]
argentum-domain.workspace = true
argentum-security.workspace = true
argentum-workspaces.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "=1.1.6"
serde_yaml.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["process"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
find-msvc-tools = "=0.1.15"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
