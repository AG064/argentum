[package]
name = "argentum-android-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# The on-device llama.cpp engine. Off by default: it needs Vulkan C++ headers to
# build and adds tens of megabytes to the app. Without it, activating an
# on-device model reports that the engine is not in this build.
llama-engine = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dependencies]
argentum-security.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
encoding_rs = { workspace = true, optional = true }
llama-cpp-2 = { workspace = true, optional = true, features = ["common", "vulkan", "android-static-stdcxx"] }

[dev-dependencies]
tempfile.workspace = true
