[package]
name = "argentum-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
desktop-control = ["dep:windows", "dep:png"]
server-support = ["rmcp/server"]

[dependencies]
argentum-domain.workspace = true
argentum-execution.workspace = true
argentum-lifecycle.workspace = true
argentum-security.workspace = true
async-trait.workspace = true
http = "1"
futures-util.workspace = true
reqwest.workspace = true
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sse-stream = "=0.2.6"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
png = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
