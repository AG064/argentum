[package]
name = "argentum-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[features]
default = []
local-llama-cpp = []
test-support = []

[dependencies]
base64 = "=0.22.1"
png = "=0.18.1"
ring = "=0.17.14"
zeroize.workspace = true
time.workspace = true
argentum-android-inference.workspace = true
argentum-domain.workspace = true
argentum-execution.workspace = true
argentum-lifecycle.workspace = true
argentum-platform.workspace = true
argentum-security.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
# Keep the previous Rust DEFLATE backend explicit after zip's feature migration.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom.workspace = true
reqwest.workspace = true
reqwest-eventsource.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
