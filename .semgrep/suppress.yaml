# Semgrep configuration - suppress known false positives

rules:
  # Path traversal - our code uses path.join with validated/sanitized input
  - id: javascript.lang.security.audit.path-traversal.path-join-resolve-traversal.path-join-resolve-traversal
    message: False positive - paths are validated/sanitized before use
    severity: warning
    languages: [javascript, typescript]
    not_conflicting: true

  # Non-literal regex - intentional for dynamic pattern matching from config
  - id: javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
    message: False positive - regex patterns are from controlled configuration
    severity: warning
    languages: [javascript, typescript]

  # Child process - using safeExec wrapper with validated commands
  - id: javascript.lang.security.detect-child-process.detect-child-process
    message: False positive - using safeExec with command validation
    severity: warning
    languages: [javascript, typescript]

  # GCM tag length - 16 bytes is correct default
  - id: javascript.node-crypto.security.gcm-no-tag-length.gcm-no-tag-length
    message: False positive - using correct 16-byte GCM tag length
    severity: warning
    languages: [javascript, typescript]

  # Insecure websocket - protocol decided at connection time
  - id: javascript.lang.security.detect-insecure-websocket.detect-insecure-websocket
    message: False positive - protocol negotiated at connection time
    severity: warning
    languages: [javascript, typescript]
