# Check every feature, so an optional feature cannot hide an advisory.
[graph]
all-features = true

[advisories]
version = 2
unmaintained = "workspace"
yanked = "deny"
# Each exception names its advisory, why it is accepted, and when it ends.
ignore = [
    # chrono is unmaintained, with no known vulnerability. Argentum uses it only to
    # show a reply's local time, on Windows and Android, where the time crate
    # cannot read the local offset. It is replaced with jiff in 0.1.1.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no vulnerability; local reply times only; replaced in 0.1.1" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
allow = []
deny = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "LicenseRef-Slint-Royalty-free-2.0",
    "LicenseRef-Slint-Software-3.0",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
private = { ignore = true }

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
